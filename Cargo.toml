[workspace]
resolver = "2"
members = ["crates/core", "crates/database", "crates/providers", "crates/engine", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
altflip-core = { path = "crates/core" }
altflip-database = { path = "crates/database" }
altflip-providers = { path = "crates/providers" }
altflip-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
ring = "0.17"
zeroize = "1"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
